[toolchain]

[features]
resolution = true
skip-lint = false

[programs.localnet]
# ── Components ────────────────────────────────────────────────
# `game_config` reuses the old `game-state` keypair (functionally the
# successor: match-level state) — keypair file is still
# `target/deploy/game_state-keypair.json`. Rename it if you want clean
# bookkeeping but Anchor doesn't require it.
game_config = "F5Sm5SQ5tCyq1SM9U3QBUR2dEQNfeVdXztmduF17rrt4"
# Replace these placeholders with the pubkeys you get from:
#   solana-keygen new -o target/deploy/player_registry-keypair.json
#   solana-keygen new -o target/deploy/player_state-keypair.json
player_registry = "8cKqpw8r4GwdKRFZFvDM95RB3C4kDgBLdtvCYNa7dwkw"
player_state = "CpHKf8pn8VvBMjJAzEePyBAgNJSxofBQLySi3uTMDfA3"

# ── Systems ───────────────────────────────────────────────────
# `init_game` / `submit_action` / `resolve_turn` / `end_match` keep
# the keypairs they had as create_match / commit_action / resolve_turn /
# end_match so on-chain upgrades land cleanly.
init_game = "FQozXZswq5TLPrbcrPK89tFAnNvQ9EXpWsSsA9WjiSYp"
submit_action = "CyR4sd7GhKvpcsRTfmbDULSjiGfH2THuCkFkhZ8RFL9A"
resolve_turn = "9kMyrkkyuhiZYMeGXJBFTgrfMMtfmBkkKk7R4eLV3NKv"
end_match = "8k8tVsZR2NvB7cAPzcJeyiq7rckBCL6MDQ2kBAGKXK3s"
# Replace these placeholders with `solana-keygen new` output too.
spawn_player = "2En9syZVpQYtt8qF5ofVaFcT2niBa8LJcqjVfbXHwpBV"
start_match = "DzxgjcQkfAW43Xt7gQcp9WBmr2vopb88UZBrX5wFMhqg"
apply_turn = "FpvpcEJCqRwCq4u4h3HgiX8ZhrseUtM8tSPkB8Mq77nv"

# ── Lobby (Anchor, not ECS) ───────────────────────────────────
lobby = "ME4mKRb4XBeFkzxsyiHEjd82Lx5cX4BUudXpno2C6DL"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[workspace]
members = ["programs-ecs/components/*", "programs-ecs/systems/*", "programs/lobby"]

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test]
startup_wait = 30000
shutdown_wait = 2000
upgradeable = false

[[test.genesis]]
address = "WorLD15A7CrDwLcLy4fRqtaTb9fbd8o8iqiEMUDse2n"
program = "tests/fixtures/world.so"
upgradeable = false

[test.validator]
bind_address = "0.0.0.0"
url = "https://rpc.magicblock.app/devnet/"
ledger = ".bolt/test-ledger"
rpc_port = 8899

[[test.validator.account]]
address = "EHLkWwAT9oebVv9ht3mtqrvHhRVMKrt54tF3MfHTey2K"
filename = "tests/fixtures/registry.json"
