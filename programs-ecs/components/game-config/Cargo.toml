[package]
name = "game-config"
version = "0.2.4"
description = "Soloon match-level state: status, phase, turn, deadlines, config, winners."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "game_config"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["bolt-lang/idl-build"]
anchor-debug = ["bolt-lang/anchor-debug"]
custom-heap = []
custom-panic = []

[dependencies]
bolt-lang.workspace = true
