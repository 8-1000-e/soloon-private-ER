[package]
name = "game-config"
version = "0.2.4"
description = "Soloon match-level state: status, phase, turn, deadlines, config, winners."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "game_config"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["bolt-lang/idl-build"]
anchor-debug = ["bolt-lang/anchor-debug"]
custom-heap = []
custom-panic = []

[dependencies]
bolt-lang.workspace = true
# Direct dep so we can call `access_control::*` for the custom
# `init_permission` ix (Bolt re-exports only `cpi::*` from this SDK).
# Pinned to 0.8.5 to match the transitive version bolt-lang resolves.
ephemeral-rollups-sdk = { version = "=0.8.5", features = ["anchor", "access-control"] }
