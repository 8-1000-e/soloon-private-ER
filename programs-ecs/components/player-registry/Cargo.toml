[package]
name = "player-registry"
version = "0.2.4"
description = "Soloon per-match list of (player authority, PlayerState PDA) pairs."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "player_registry"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["bolt-lang/idl-build"]
anchor-debug = ["bolt-lang/anchor-debug"]
custom-heap = []
custom-panic = []

[dependencies]
bolt-lang.workspace = true
# Direct dep so we can call `access_control::*` for the custom
# `init_permission` ix (Bolt re-exports only `cpi::*` from this SDK).
ephemeral-rollups-sdk = { version = "=0.8.5", features = ["anchor", "access-control"] }
