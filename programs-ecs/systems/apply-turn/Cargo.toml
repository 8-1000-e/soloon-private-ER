[package]
name = "apply-turn"
version = "0.2.4"
description = "Apply pass: copies `GameConfig.pending_effects[seat]` onto one PlayerState. Called once per player after resolve-turn."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "apply_turn"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["bolt-lang/idl-build"]
anchor-debug = ["bolt-lang/anchor-debug"]
custom-heap = []
custom-panic = []

[dependencies]
bolt-lang.workspace = true
game-config = { path = "../../components/game-config", features = ["cpi"] }
player-state = { path = "../../components/player-state", features = ["cpi"] }
