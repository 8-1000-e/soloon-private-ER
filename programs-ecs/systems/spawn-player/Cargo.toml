[package]
name = "spawn-player"
version = "0.2.4"
description = "Registers a new player in a Soloon match (creates PlayerState, appends to PlayerRegistry)."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "spawn_player"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["bolt-lang/idl-build"]
anchor-debug = ["bolt-lang/anchor-debug"]
custom-heap = []
custom-panic = []

[dependencies]
bolt-lang.workspace = true
game-config = { path = "../../components/game-config", features = ["cpi"] }
player-registry = { path = "../../components/player-registry", features = ["cpi"] }
player-state = { path = "../../components/player-state", features = ["cpi"] }
