[package]
name = "lobby"
version = "0.1.0"
description = "007 game lobby with SOL escrow and prize distribution"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "lobby"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["derive"] }
